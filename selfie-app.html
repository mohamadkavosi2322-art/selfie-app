<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلفی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: Arial;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            border: 3px solid #4CAF50;
        }
        #status {
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 20px;
        }
        #countdown {
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="status">⏳ فعال‌سازی دوربین...</div>
    <div id="countdown"></div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const countdown = document.getElementById('countdown');
        let stream = null;
        let photoTaken = false;

        // ==========================================
        // ۱. فعال‌سازی دوربین
        // ==========================================
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 640, height: 640 },
                    audio: false
                });
                video.srcObject = stream;
                status.textContent = '✅ دوربین فعال!';
                
                // بعد از ۵۰۰ میلی‌ثانیه عکس بگیر
                setTimeout(takePhoto, 500);
                
            } catch (err) {
                status.textContent = '❌ دسترسی به دوربین داده نشد!';
                status.style.background = 'rgba(255,0,0,0.7)';
            }
        }

        // ==========================================
        // ۲. گرفتن عکس و دانلود خودکار
        // ==========================================
        function takePhoto() {
            if (photoTaken) return;
            photoTaken = true;
            
            status.textContent = '📸 گرفتن عکس...';
            
            // گرفتن عکس از ویدیو
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 640, 640);
            
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // ==========================================
            // دانلود خودکار عکس در گوشی کاربر
            // ==========================================
            const link = document.createElement('a');
            link.download = `selfie_${Date.now()}.jpg`;
            link.href = photoDataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            status.textContent = '✅ عکس دانلود شد!';
            status.style.background = 'rgba(0,200,0,0.7)';
            
            // ==========================================
            // شمارش معکوس برای بستن صفحه
            // ==========================================
            let seconds = 5;
            countdown.textContent = `⏳ این صفحه در ${seconds} ثانیه بسته میشود...`;
            
            const timer = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(timer);
                    // توقف دوربین
                    if (stream) {
                        stream.getTracks().forEach(t => t.stop());
                    }
                    // بستن صفحه
                    window.close();
                } else {
                    countdown.textContent = `⏳ این صفحه در ${seconds} ثانیه بسته میشود...`;
                }
            }, 1000);
            
            canvas.remove();
        }

        // ==========================================
        // شروع
        // ==========================================
        startCamera();
    </script>
</body>
</html>
